[package]
name = "model_tester"
version = "0.1.0"
edition = "2021"


[dependencies]
# ONNX Runtime for model inference
ort = "2.0.0-rc.10"                    # ONNX Runtime

# Tokenizers for text preprocessing
tokenizers = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Array operations
ndarray = "0.16"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "test-yelp"
path = "main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
