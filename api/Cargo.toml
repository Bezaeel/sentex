[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
# ONNX Runtime for model inference
ort = { version = "2.0.0-rc.10", features = ["half"] }

# Tokenizers for text preprocessing
tokenizers = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Array operations
ndarray = "0.16"

# Error handling
anyhow = "1.0"

# Synchronization
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
